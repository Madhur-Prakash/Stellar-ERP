# =============================================================================
# Security headers, as an includable snippet.
#
# This exists because of a genuine nginx footgun: `add_header` directives are
# inherited from the enclosing block *only if the current block defines none of
# its own*. The moment a `location` adds a single header - say a Cache-Control
# for hashed assets - every inherited security header is silently dropped for
# that location.
#
# The failure is invisible: the site still works, and `curl -I /` on a location
# without add_header still shows the headers, so it looks correct. Only the
# locations that set their own caching lose them.
#
# So they are included explicitly in every location that defines add_header,
# rather than relying on inheritance.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
