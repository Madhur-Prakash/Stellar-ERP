<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal ERP</title>
    <meta name="description" content="A self-hosted ERP for small businesses" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Applies the stored theme before first paint.
         Without this the page renders light, then flips to dark once React
         hydrates - a visible flash on every load. Runs synchronously and is
         intentionally tiny. */
      (function () {
        try {
          var stored = localStorage.getItem('personalerp-theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode: fall back to the class already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
