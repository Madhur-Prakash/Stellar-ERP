[package]
name = "proof_ledger"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ledger 3 - append-only cryptographic commitments to a business's books."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
