# Alembic configuration.
#
# The database URL is deliberately absent: it is injected at runtime from
# app.core.config in migrations/env.py, so there is exactly one place that knows
# how to build a DSN and no credentials are committed to the repository.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, slugged filenames sort chronologically in a directory listing and
# say what they do - "20260726_1430_a1b2c3_add_user_table.py" beats "a1b2c3.py".
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Truncate the slug so filenames stay within path limits on Windows.
truncate_slug_length = 40

version_path_separator = os

[post_write_hooks]
# Autogenerated migrations are machine-formatted; run them through the same
# formatter as hand-written code so review diffs are not noise.
#
# `module`, i.e. `python -m ruff`, resolved against the *running* interpreter.
#
# The two obvious alternatives both fail here:
#   - `exec` + `executable = ruff` needs ruff on PATH, and dies with a bare
#     FileNotFoundError under `python -m alembic`.
#   - `console_scripts` + `entrypoint = ruff` cannot work at all: ruff is a Rust
#     binary and declares no Python entry points, so Alembic reports
#     "Could not find entrypoint console_scripts.ruff".
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging: minimal. Application logging is logifyx's job (see app/core/logging.py),
# which also bridges the `alembic` logger onto its handlers.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
